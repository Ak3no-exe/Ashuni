- name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./app/gradlew" ]; then
            cd app
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERREUR : fichier gradlew introuvable"
            echo "Contenu du dépôt :"
            ls -la
            find . -maxdepth 4 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi
